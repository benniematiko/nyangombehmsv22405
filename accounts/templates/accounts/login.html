{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProClinic Hospital Management System</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;       /* vertical center */
            justify-content: center;   /* horizontal center */
            background: #f1f5f9;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .portal-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #d9e2ec;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .portal-icon { font-size: 44px; margin-bottom: 12px; }

        h1 { font-size: 22px; color: #0f172a; margin-bottom: 8px; }

        .tagline { font-size: 14px; color: #64748b; margin-bottom: 28px; }

        .form-group { text-align: left; margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus { border-color: #2563eb; }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: #fff;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="portal-card">
            <div class="portal-icon">🔐</div>
            <h1>Authorized User Portal Login</h1>
            <p class="tagline">Please authenticate with your official clinical credentials.</p>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" autofocus required placeholder="e.g. dr_smith">
                </div>

                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">Sign In to System</button>
            </form>
        </div>
    </div>

</body>
</html>
